<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Thayane: Protocolo Roberto</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #00ff41; /* CRT Green */
        }
        
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #terminal-panel {
            pointer-events: auto;
            background: rgba(0, 20, 0, 0.9);
            border-top: 2px solid #00ff41;
            padding: 10px;
            height: 30vh;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
        }
        
        #editor {
            flex-grow: 1;
            font-size: 14px;
            border: 1px solid #004400;
        }

        /* CodeMirror overrides for Green Terminal Theme */
        .CodeMirror {
            height: 100% !important;
            background: transparent !important;
            color: #00ff41 !important;
        }
        .CodeMirror-cursor {
            border-left: 2px solid #00ff41 !important;
        }
        .CodeMirror-gutters {
            background: transparent !important;
            border-right: 1px solid #004400 !important;
        }
        .CodeMirror-linenumber {
            color: #004400 !important;
        }
        
        #controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        button {
            background: #003300;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 5px 15px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #00ff41;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div style="padding: 20px;">
            <h1>PROT: ROBERTO // PICO PARANA</h1>
            <div id="status-readout">STATUS: AGUARDANDO COMANDO...</div>
        </div>
        
        <div id="terminal-panel">
            <div class="terminal-header">Interface de Comando</div>
            <div id="editor"></div>
            <div id="controls">
                <button id="btn-run">Executar Protocolo</button>
                <button id="btn-reset">Reiniciar</button>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
