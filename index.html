<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Thayane: Protocolo Roberto</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #00ff41;
            /* CRT Green */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER */
        #header-panel {
            padding: 20px;
            pointer-events: auto;
        }

        /* CAMERA CONTROLS (D-PAD STYLE) */
        #camera-controls {
            position: absolute;
            bottom: 40%;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #00ff41;
            border-radius: 8px;
            pointer-events: auto;

            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 5px;
            align-items: center;
            justify-items: center;
        }

        #camera-controls button {
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            width: 100%;
            height: 100%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
            border-radius: 4px;
        }

        #camera-controls button:hover {
            background: #00ff41;
            color: #000;
        }

        /* D-Pad Placement */
        #btn-rotate-ccw {
            /* Row 1 */
            grid-column: 1;
            grid-row: 1;
            font-size: 20px;
        }

        #btn-pan-n {
            grid-column: 2;
            grid-row: 1;
        }

        #btn-rotate-cw {
            /* Row 1 */
            grid-column: 3;
            grid-row: 1;
            font-size: 20px;
        }

        #btn-pan-w {
            /* Row 2 */
            grid-column: 1;
            grid-row: 2;
        }

        #btn-focus {
            grid-column: 2;
            grid-row: 2;
            font-size: 10px !important;
            font-weight: bold;
        }

        #btn-pan-e {
            grid-column: 3;
            grid-row: 2;
        }

        #btn-zoom-in {
            /* Row 3 */
            grid-column: 1;
            grid-row: 3;
            font-size: 20px;
        }

        #btn-pan-s {
            grid-column: 2;
            grid-row: 3;
        }

        #btn-zoom-out {
            /* Row 3 */
            grid-column: 3;
            grid-row: 3;
            font-size: 20px;
        }

        /* TERMINAL / INTERFACE CONTAINER */
        #interface-container {
            pointer-events: auto;
            background: rgba(0, 20, 0, 0.95);
            border-top: 2px solid #00ff41;
            padding: 10px;
            height: 30vh;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
        }

        .terminal-fullscreen {
            position: absolute !important;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 2000;
            padding: 20px !important;
            box-sizing: border-box;
        }

        .terminal-fullscreen .CodeMirror {
            height: 100% !important;
        }

        #terminal-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        #terminal-header:hover {
            color: #fff;
            text-shadow: 0 0 5px #00ff41;
        }

        .icon-btn {
            background: none;
            border: 1px solid #004400;
            color: inherit;
            cursor: pointer;
            font-size: 1.2em;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 10px;
        }

        .icon-btn:hover {
            background: #004400;
            color: #fff;
        }

        #editor {
            flex-grow: 1;
            font-size: 14px;
            border: 1px solid #004400;
            overflow: hidden;
        }

        #controls-bar {
            display: flex;
            justify-content: space-between; /* Separa os grupos */
            padding: 10px;
            background: #001100;
            border-top: 1px solid #00ff00;
        }
        .secondary-controls {
            display: flex;
            gap: 10px;
        }
        .cmd-btn.action {
            background: #003300;
            border: 1px solid #00aa00;
            color: #aaffaa;
        }
        .cmd-btn.action:hover {
            background: #005500;
        }

        #controls-bar button {
            background: #003300;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 5px 15px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }

        #controls-bar button:hover {
            background: #00ff41;
            color: #000;
        }

        /* CodeMirror Theme Overrides */
        .CodeMirror {
            height: 100% !important;
            background: transparent !important;
            /* Default transparent for hacker theme */
            color: #00ff41 !important;
        }

        /* Allow theme overrides */
        .cm-s-dracula.CodeMirror {
            background: #282a36 !important;
            color: #f8f8f2 !important;
        }

        .cm-s-elegant.CodeMirror {
            background: #fdf6e3 !important;
            color: #000 !important;
        }
    </style>
  <script type="module" crossorigin src="/projeto-thayane/assets/index-7pKvA_MJ.js"></script>
</head>

<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="header-panel">
            <h1>PRJ: ROBERTO // PICO PARANA</h1>
            <div id="status-readout">STATUS: AGUARDANDO COMANDO...</div>
        </div>

        <!-- Camera Controls (D-Pad Grid) -->
        <div id="camera-controls">
            <!-- Row 1 -->
            <button id="btn-rotate-ccw" title="Rotate Left">↺</button>
            <button id="btn-pan-n" title="Pan North">⬆️</button>
            <button id="btn-rotate-cw" title="Rotate Right">↻</button>

            <!-- Row 2 -->
            <button id="btn-pan-w" title="Pan West">⬅️</button>
            <button id="btn-focus" title="Focar Roberto">RBT</button>
            <button id="btn-pan-e" title="Pan East">➡️</button>

            <!-- Row 3 -->
            <button id="btn-zoom-in" title="Zoom In">+</button>
            <button id="btn-pan-s" title="Pan South">⬇️</button>
            <button id="btn-zoom-out" title="Zoom Out">-</button>
        </div>

        <!-- Terminal Interface -->
        <div id="interface-container">
            <div id="terminal-header" title="Clique para expandir/minimizar">
                <div style="display:flex; align-items:center;">
                    <span>Interface de Comando</span>
                    <button id="btn-theme-toggle" class="icon-btn" title="Mudar Tema">🌙</button>
                </div>
                <span style="font-size: 1.2em;">[ ⛶ ]</span>
            </div>
            <div id="editor"></div>
            <div id="controls-bar">
                <div class="primary-controls" style="display: flex; align-items: center; gap: 15px;">
                    <button id="btn-run" class="cmd-btn run">Executar Protocolo</button>
                    <button id="btn-reset" class="cmd-btn">Reiniciar Posição</button>
                    
                    <div id="language-selector" style="display: flex; gap: 10px; color: #00ff41; font-weight: bold;">
                        <label style="cursor: pointer;">
                            <input type="radio" name="editor-lang" value="python" checked> Python
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="editor-lang" value="meupia"> meuPiá
                        </label>
                    </div>
                </div>
            
                <div class="secondary-controls">
                    <button id="btn-new-map" class="cmd-btn action" title="Gerar um novo labirinto">🔄 Novo Mapa</button>
                    <button id="btn-download" class="cmd-btn action" title="Baixar código">💾 Download .PY</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
